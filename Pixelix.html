<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clicker & Canvas Géant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #1e1e24;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Top Bar de statut */
        #status-bar {
            background-color: #111;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffd700;
            border-bottom: 2px solid #333;
        }
        /* Menu Principal en bas pour un accès facile sur téléphone */
        #main-menu {
            display: flex;
            background-color: #2a2a35;
            border-top: 2px solid #333;
        }
        .menu-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        .menu-btn.active {
            color: #fff;
            background-color: #3e3e50;
            border-bottom: 4px solid #00adb5;
        }
        /* Conteneur d'écrans */
        #view-container {
            flex: 1;
            position: relative;
        }
        .view {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .view.active {
            display: flex;
        }
        /* Vue 1: Le Clicker */
        #clicker-btn {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, #ffd700 0%, #b8860b 100%);
            border: 5px solid #fff;
            color: #333;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }
        #clicker-btn:active {
            transform: scale(0.92);
        }
        /* Vue 2: La Carte Géante */
        #map-view {
            padding: 0;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            background-color: #111;
        }
        canvas:active {
            cursor: grabbing;
        }
        /* Interface de contrôle de la carte */
        #map-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            pointer-events: none;
            line-height: 1.4;
        }
        #color-picker-container {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #color-picker {
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Barre de Score Unique globale -->
    <div id="status-bar">🪙 Coins : <span id="coin-count">0</span></div>

    <!-- Zone d'affichage des deux onglets -->
    <div id="view-container">
        
        <!-- ONGLET 1: CLICKER -->
        <div id="clicker-view" class="view active">
            <button id="clicker-btn">CLICK !</button>
            <p style="margin-top: 20px; color: #aaa; text-align: center;">Cliquez sur la pièce pour gagner des Coins</p>
        </div>

        <!-- ONGLET 2: CARTE GÉANTE -->
        <div id="map-view" class="view">
            <canvas id="mapCanvas"></canvas>
            
            <div id="map-controls">
                <strong>Carte : 1 000 000 × 1 000 000</strong><br>
                📱 Glisser pour se déplacer<br>
                🔍 Molette ou Pincer pour zoomer<br>
                ⚡ Tap / Clic pour placer un pixel (Coût : 1 🪙)<br>
                <span style="color: #00adb5;">Position : X: <span id="coord-x">0</span>, Y: <span id="coord-y">0</span></span>
            </div>

            <div id="color-picker-container">
                <label for="color-picker" style="font-size: 0.9rem;">Couleur :</label>
                <input type="color" id="color-picker" value="#00adb5">
            </div>
        </div>

    </div>

    <!-- MENU PRINCIPAL AVEC 2 OPTIONS -->
    <div id="main-menu">
        <button class="menu-btn active" onclick="switchView('clicker-view', this)">⛏️ CLICKER</button>
        <button class="menu-btn" onclick="switchView('map-view', this)">🗺️ MAP GÉANTE</button>
    </div>

    <script>
        // --- ÉTAT DU JEU ---
        let coins = 0;
        const placedPixels = new Map(); 
        const MAP_SIZE = 1000000;

        function updateCoinDisplay() {
            document.getElementById('coin-count').textContent = coins;
        }

        // --- GESTION DU MENU ---
        function switchView(viewId, buttonElement) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(viewId).classList.add('active');
            buttonElement.classList.add('active');

            if (viewId === 'map-view') {
                resizeCanvas();
            }
        }

        // --- CODE DU CLICKER ---
        document.getElementById('clicker-btn').addEventListener('click', () => {
            coins++;
            updateCoinDisplay();
        });

        // --- CODE DE LA MAP GÉANTE (CANVAS) ---
        const canvas = document.getElementById('mapCanvas');
        const ctx = canvas.getContext('2d');

        let zoom = 10; 
        let cameraX = MAP_SIZE / 2;
        let cameraY = MAP_SIZE / 2;

        let isDragging = false;
        let startX, startY;
        let hasDragged = false;

        function resizeCanvas() {
            if (canvas.clientWidth === 0) return;
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
            drawMap();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const left = cameraX - (canvas.width / 2) / zoom;
            const right = cameraX + (canvas.width / 2) / zoom;
            const top = cameraY - (canvas.height / 2) / zoom;
            const bottom = cameraY + (canvas.height / 2) / zoom;

            if (zoom > 4) {
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 0.5;
                const startGridX = Math.floor(left);
                const endGridX = Math.ceil(right);
                const startGridY = Math.floor(top);
                const endGridY = Math.ceil(bottom);

                ctx.beginPath();
                for (let x = startGridX; x <= endGridX; x++) {
                    const screenX = (x - cameraX) * zoom + canvas.width / 2;
                    ctx.moveTo(screenX, 0);
                    ctx.lineTo(screenX, canvas.height);
                }
                for (let y = startGridY; y <= endGridY; y++) {
                    const screenY = (y - cameraY) * zoom + canvas.height / 2;
                    ctx.moveTo(0, screenY);
                    ctx.lineTo(canvas.width, screenY);
                }
                ctx.stroke();
            }

            placedPixels.forEach((color, key) => {
                const [px, py] = key.split(',').map(Number);
                if (px >= left && px <= right && py >= top && py <= bottom) {
                    const screenX = (px - cameraX) * zoom + canvas.width / 2;
                    const screenY = (py - cameraY) * zoom + canvas.height / 2;
                    ctx.fillStyle = color;
                    ctx.fillRect(Math.floor(screenX), Math.floor(screenY), Math.ceil(zoom), Math.ceil(zoom));
                }
            });
        }

        function screenToWorld(screenX, screenY) {
            const worldX = Math.floor((screenX - canvas.width / 2) / zoom + cameraX);
            const worldY = Math.floor((screenY - canvas.height / 2) / zoom + cameraY);
            return { x: worldX, y: worldY };
        }

        // --- VOTRE SCRIPT MOBILE MIS À JOUR ---
        function updateCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const world = screenToWorld(clientX - rect.left, clientY - rect.top);
            if(world.x >= 0 && world.x < MAP_SIZE && world.y >= 0 && world.y < MAP_SIZE) {
                document.getElementById('coord-x').textContent = world.x;
                document.getElementById('coord-y').textContent = world.y;
            }
        }

        function startDrag(e) {
            isDragging = true;
            hasDragged = false;
            startX = e.touches ? e.touches[0].clientX : e.clientX;
            startY = e.touches ? e.touches[0].clientY : e.clientY;
        }

        function doDrag(e) {
            if (!isDragging) return;
        function doDrag(e) {
            if (!isDragging) return;
            const currentX = e.touches ? e.touches[0].clientX : e.clientX;
            const currentY = e.touches ? e.touches[0].clientY : e.clientY;
            
            const dx = currentX - startX;
            const dy = currentY - startY;

            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                hasDragged = true;
            }

            cameraX -= dx / zoom;
            cameraY -= dy / zoom;

            cameraX = Math.max(0, Math.min(MAP_SIZE, cameraX));
            cameraY = Math.max(0, Math.min(MAP_SIZE, cameraY));

            startX = currentX;
            startY = currentY;
            
            drawMap();
            updateCoords(e);
        }

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;

            if (!hasDragged) {
                const rect = canvas.getBoundingClientRect();
                const endX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const endY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                
                const world = screenToWorld(endX - rect.left, endY - rect.top);

                if (world.x >= 0 && world.x < MAP_SIZE && world.y >= 0 && world.y < MAP_SIZE) {
                    if (coins >= 1) {
                        const key = `${world.x},${world.y}`; 
                        const selectedColor = document.getElementById('color-picker').value;
                        
                        if (placedPixels.get(key) !== selectedColor) {
                            placedPixels.set(key, selectedColor);
                            coins--;
                            updateCoinDisplay();
                            drawMap();
                        }
                    } else {
                        alert("Pas assez de jetons ! Retournez sur le Clicker pour miner des Coins 🪙.");
                    }
                }
            }
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = 1.2;
            if (e.deltaY < 0) {
                zoom = Math.min(100, zoom * zoomFactor);
            } else {
                zoom = Math.max(0.1, zoom / zoomFactor);
            }
            drawMap();
        }, { passive: false });

        canvas.addEventListener('mousedown', startDrag);
        canvas.addEventListener('mousemove', (e) => { doDrag(e); updateCoords(e); });
        canvas.addEventListener('mouseup', endDrag);

        canvas.addEventListener('touchstart', startDrag, { passive: true });
        canvas.addEventListener('touchmove', (e) => { doDrag(e); }, { passive: true });
        canvas.addEventListener('touchend', endDrag, { passive: true });

        updateCoinDisplay();
